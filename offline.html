<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>لا يوجد اتصال | YLY System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #111827 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            font-weight: 900;
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        p {
            font-weight: 600;
            font-size: 14px;
            color: #d1d5db;
            margin: 0 0 30px 0;
            line-height: 1.6;
        }
        .retry-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.5);
        }
        .retry-btn:active {
            transform: scale(0.95);
            background: #b91c1c;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>انقطع الاتصال بالإنترنت</h1>
        <p>يبدو أنك غير متصل بالإنترنت حالياً.<br>يرجى التحقق من اتصالك والمحاولة مرة أخرى.</p>
        <button class="retry-btn" onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
