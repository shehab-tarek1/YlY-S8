<script>
  document.addEventListener("DOMContentLoaded", () => {
    const newsContainer = document.querySelector("#news-preview .container .flex-col");
    if (!newsContainer) return;

    const savedNews = JSON.parse(localStorage.getItem("yly_news") || "[]");

    if (savedNews.length > 0) {
      // إزالة علامة التحميل واستبدالها بالأخبار الحقيقية
      let cardsHtml = '<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%;">';
      
      savedNews.forEach(item => {
        cardsHtml += `
          <div style="background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden;">
            <img src="${item.image}" style="width: 100%; height: 180px; object-fit: cover;">
            <div style="padding: 16px; text-align: right;">
              <span style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">${item.date}</span>
              <h3 style="font-size: 1.1rem; color: #fff; margin: 8px 0;">${item.title}</h3>
              <p style="font-size: 0.85rem; color: #94a3b8; line-height: 1.5;">${item.content}</p>
            </div>
          </div>
        `;
      });
      cardsHtml += '</div>';
      newsContainer.outerHTML = cardsHtml;
    }
  });
</script>
